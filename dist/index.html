<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thermal Docs</title>
  <meta name="description" content="A minimal editor for 48 mm thermal-printer pages.">
  <style>
    :root {
      --page-width: 48mm;
      --page-height: 210mm;
      --page-padding: 3.5mm;
      --ink: #18221d;
      --muted: #69756f;
      --line: #d8dfdb;
      --canvas: #e9edeb;
      font-family: Arial, sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 58px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(249, 250, 249, .96);
      backdrop-filter: blur(10px);
    }

    .brand {
      margin-right: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -.2px;
      white-space: nowrap;
    }

    .tool,
    .size-select {
      height: 38px;
      border: 1px solid #cbd4cf;
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      font: 600 14px/1 Arial, sans-serif;
    }

    .tool {
      display: inline-grid;
      min-width: 38px;
      padding: 0 10px;
      place-items: center;
      cursor: pointer;
    }

    .tool:hover,
    .tool:focus-visible,
    .size-select:hover,
    .size-select:focus-visible {
      border-color: #809087;
      outline: none;
    }

    .tool[aria-pressed="true"] {
      border-color: #203e30;
      background: #e6eee9;
    }

    .size-select {
      width: 76px;
      padding: 0 8px;
      cursor: pointer;
    }

    .print {
      margin-left: 3px;
      border-color: #203e30;
      background: #203e30;
      color: #fff;
    }

    .print:hover,
    .print:focus-visible {
      border-color: #10281d;
      background: #10281d;
    }

    .align-glyph {
      display: flex;
      width: 16px;
      flex-direction: column;
      gap: 3px;
    }

    .align-glyph i {
      display: block;
      width: 16px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
    }

    .align-glyph i:nth-child(2) { width: 10px; }
    .align-glyph i:nth-child(3) { width: 13px; }
    .align-left { align-items: flex-start; }
    .align-center { align-items: center; }
    .align-right { align-items: flex-end; }

    .workspace {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: calc(100vh - 58px);
      padding: 28px 16px 64px;
    }

    .paper-wrap {
      position: relative;
    }

    #paper {
      position: relative;
      width: var(--page-width);
      min-height: var(--page-height);
      padding: var(--page-padding);
      overflow: hidden;
      background: #fff;
      box-shadow: 0 7px 24px rgba(22, 35, 28, .16);
    }

    #editor {
      position: relative;
      z-index: 1;
      min-height: calc(var(--page-height) - (2 * var(--page-padding)));
      border: 0;
      outline: 0;
      color: #000;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.38;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      caret-color: #000;
    }

    #editor:empty::before {
      color: #a0a8a3;
      content: attr(data-placeholder);
      pointer-events: none;
    }

    .page-break {
      position: absolute;
      z-index: 3;
      right: 0;
      left: 0;
      height: 0;
      border-top: 1px dashed #aab5af;
      pointer-events: none;
    }

    .page-break span {
      position: absolute;
      top: -10px;
      left: calc(100% + 10px);
      width: max-content;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--canvas);
      color: var(--muted);
      font: 10px/1.4 Arial, sans-serif;
    }

    .hint {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 430px) {
      .toolbar { gap: 4px; padding-inline: 8px; }
      .brand { display: none; }
      .tool { min-width: 36px; padding-inline: 8px; }
      .page-break span { display: none; }
    }

    @page {
      size: 48mm 210mm;
      margin: 0;
    }

    @media print {
      html,
      body {
        width: 48mm;
        min-height: 0;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
      }

      .toolbar,
      .hint,
      .page-break {
        display: none !important;
      }

      .workspace {
        display: block;
        min-height: 0;
        padding: 0;
        background: #fff;
      }

      #paper {
        width: 48mm;
        height: auto !important;
        min-height: 0;
        margin: 0;
        padding: var(--page-padding);
        overflow: visible;
        box-shadow: none;
      }

      #editor {
        min-height: 0 !important;
      }
    }
  </style>
</head>
<body>
  <header class="toolbar" aria-label="Text tools">
    <span class="brand">Thermal Docs</span>

    <label class="sr-only" for="font-size">Text size</label>
    <select class="size-select" id="font-size" title="Text size">
      <option value="10">10 px</option>
      <option value="12" selected>12 px</option>
      <option value="14">14 px</option>
      <option value="16">16 px</option>
      <option value="18">18 px</option>
      <option value="20">20 px</option>
    </select>

    <button class="tool" id="checkbox" type="button" title="Insert open checkbox" aria-label="Insert open checkbox">☐</button>
    <button class="tool align" type="button" data-command="justifyLeft" title="Align left" aria-label="Align left"><span class="align-glyph align-left" aria-hidden="true"><i></i><i></i><i></i></span></button>
    <button class="tool align" type="button" data-command="justifyCenter" title="Align center" aria-label="Align center"><span class="align-glyph align-center" aria-hidden="true"><i></i><i></i><i></i></span></button>
    <button class="tool align" type="button" data-command="justifyRight" title="Align right" aria-label="Align right"><span class="align-glyph align-right" aria-hidden="true"><i></i><i></i><i></i></span></button>
    <button class="tool print" id="print" type="button">Print</button>
  </header>

  <main class="workspace">
    <div class="paper-wrap">
      <article id="paper" aria-label="48 by 210 millimeter print page">
        <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true" data-placeholder="Type your note…"></div>
        <div id="breaks" aria-hidden="true"></div>
      </article>
    </div>
    <p class="hint" id="status">48 × 210 mm · Arial · fixed margins · saved in this browser</p>
  </main>

  <script>
    const PAGE_HEIGHT_MM = 210;
    const PAGE_PADDING_MM = 7;
    const PX_PER_MM = 96 / 25.4;
    const STORAGE_KEY = 'thermal-docs-minimal-v1';
    const editor = document.getElementById('editor');
    const paper = document.getElementById('paper');
    const breaks = document.getElementById('breaks');
    const sizeSelect = document.getElementById('font-size');
    const status = document.getElementById('status');
    let saveTimer;

    function contentHeight() {
      const previous = editor.style.minHeight;
      editor.style.minHeight = '0';
      const height = editor.scrollHeight;
      editor.style.minHeight = previous;
      return height;
    }

    function updatePages() {
      const usablePagePx = (PAGE_HEIGHT_MM - PAGE_PADDING_MM) * PX_PER_MM;
      const pages = Math.max(1, Math.ceil(contentHeight() / usablePagePx));
      paper.style.height = `${pages * PAGE_HEIGHT_MM}mm`;
      editor.style.minHeight = `${(pages * PAGE_HEIGHT_MM) - PAGE_PADDING_MM}mm`;
      breaks.replaceChildren();

      for (let page = 1; page < pages; page += 1) {
        const marker = document.createElement('div');
        marker.className = 'page-break';
        marker.style.top = `${page * PAGE_HEIGHT_MM}mm`;
        marker.innerHTML = `<span>Page ${page + 1}</span>`;
        breaks.append(marker);
      }

      status.textContent = `48 × 210 mm · ${pages} ${pages === 1 ? 'page' : 'pages'} · saved in this browser`;
    }

    function saveDraft() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            html: editor.innerHTML,
            fontSize: sizeSelect.value
          }));
        } catch {
          status.textContent = 'This browser could not save the draft.';
        }
      }, 120);
    }

    function changed() {
      updatePages();
      saveDraft();
    }

    function putCaretAtEnd() {
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function focusEditor() {
      if (!editor.contains(window.getSelection()?.anchorNode)) {
        editor.focus();
        putCaretAtEnd();
      }
    }

    function restoreDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (draft && typeof draft.html === 'string') editor.innerHTML = draft.html;
        if (draft && ['10', '12', '14', '16', '18', '20'].includes(draft.fontSize)) {
          sizeSelect.value = draft.fontSize;
        }

        if (!draft) {
          const oldDraft = JSON.parse(localStorage.getItem('thermal-docs') || 'null');
          if (oldDraft && typeof oldDraft.body === 'string') {
            editor.textContent = `${oldDraft.title ? `${oldDraft.title}\n\n` : ''}${oldDraft.body}`;
            if (['10', '12', '14', '16'].includes(oldDraft.font)) sizeSelect.value = oldDraft.font;
          }
        }
      } catch {}

      editor.style.fontSize = `${sizeSelect.value}px`;
      updatePages();
    }

    editor.addEventListener('input', changed);
    editor.addEventListener('paste', event => {
      event.preventDefault();
      document.execCommand('insertText', false, event.clipboardData.getData('text/plain'));
    });

    sizeSelect.addEventListener('change', () => {
      editor.style.fontSize = `${sizeSelect.value}px`;
      changed();
      editor.focus();
    });

    document.getElementById('checkbox').addEventListener('mousedown', event => event.preventDefault());
    document.getElementById('checkbox').addEventListener('click', () => {
      focusEditor();
      document.execCommand('insertText', false, '☐ ');
      changed();
    });

    document.querySelectorAll('[data-command]').forEach(button => {
      button.addEventListener('mousedown', event => event.preventDefault());
      button.addEventListener('click', () => {
        focusEditor();
        document.execCommand(button.dataset.command, false, null);
        changed();
      });
    });

    document.addEventListener('selectionchange', () => {
      if (!editor.contains(window.getSelection()?.anchorNode)) return;
      document.querySelectorAll('[data-command]').forEach(button => {
        button.setAttribute('aria-pressed', String(document.queryCommandState(button.dataset.command)));
      });
    });

    document.getElementById('print').addEventListener('click', () => {
      updatePages();
      window.print();
    });

    window.addEventListener('resize', updatePages);
    restoreDraft();
  </script>
</body>
</html>
